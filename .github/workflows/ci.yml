name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: python_poc_test
          POSTGRES_USER: python_poc
          POSTGRES_PASSWORD: python_poc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U python_poc -d python_poc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://python_poc:python_poc_ci@localhost:5432/python_poc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps .
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest
      - run: docker build -t python-practice:${{ github.sha }} .
