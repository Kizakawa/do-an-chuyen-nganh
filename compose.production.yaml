services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    networks: [backend]

  migrate:
    build: .
    env_file: [.env.production]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    build: .
    env_file: [.env.production]
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=${TRUSTED_PROXY_IPS:-127.0.0.1}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks: [backend]

  grading-worker:
    build: .
    env_file: [.env.production]
    command: ["python", "-m", "app.worker", "--idle-seconds", "1"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  hint-worker:
    build: .
    env_file: [.env.production]
    command: ["python", "-m", "app.hint_worker", "--idle-seconds", "1"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

volumes:
  postgres_production_data:

networks:
  backend:
